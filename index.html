<style>

    --red: #d6342c;

    --ink-soft: #6f675c;

    --font-display: "Bricolage Grotesque", system-ui, sans-serif;
    --font-body: "Plus Jakarta Sans", system-ui, sans-serif;
    --shadow-sm: 0 1px 2px rgba(33,28,22,.06), 0 4px 14px rgba(33,28,22,.05);
    --shadow-md: 0 8px 30px rgba(33,28,22,.10);
    --shadow-lg: 0 24px 60px rgba(33,28,22,.16);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background: transparent;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  html { background: var(--cream); }

  /* ---------- Page backgrounds (tweakable via [data-bg]) ---------- */
  .page-bg {
    position: fixed; inset: 0; z-index: -1;
    transition: background .5s ease, opacity .5s ease;
  }
  body[data-bg="cream"] .page-bg {
    background:
      radial-gradient(1200px 700px at 82% -8%, rgba(78,155,53,.10), transparent 60%),
      radial-gradient(1100px 640px at 8% 6%, rgba(214,52,44,.07), transparent 58%),
      linear-gradient(180deg, #fbf8f1, #f3ede1);
  }
  body[data-bg="pattern"] .page-bg {
    background-color: #f7f2e9;
    background-image:
      radial-gradient(rgba(33,28,22,.045) 1.4px, transparent 1.5px),
      radial-gradient(rgba(33,28,22,.045) 1.4px, transparent 1.5px);
    background-size: 26px 26px, 26px 26px;
    background-position: 0 0, 13px 13px;
  }
  /* fixed brick photo that everything scrolls over */
  body[data-bg="brick"] .page-bg {
    background-image:
      linear-gradient(180deg, rgba(28,16,10,.46), rgba(28,16,10,.52)),
      url("brick.jpg");
    background-size: cover, 760px auto;
    background-position: center, center top;
    background-repeat: no-repeat, repeat;
    background-attachment: fixed, fixed;
  }
  /* brick mode: soft-cream cards (header tone) + white section titles */
  body[data-bg="brick"] { --card: #f4efe6; }
  body[data-bg="brick"] .sec-head h2 {
    color: #fff !important; text-shadow: 0 2px 14px rgba(0,0,0,.4);
  }
  body[data-bg="brick"] .sec-head p,
  body[data-bg="brick"] .scroll-hint {
    color: rgba(255,255,255,.85) !important; text-shadow: 0 1px 10px rgba(0,0,0,.34);
  }
  body[data-bg="brick"] .site-footer,
  body[data-bg="brick"] .site-footer * {
    color: rgba(255,255,255,.92) !important; border-color: rgba(255,255,255,.22) !important;
  }
  body[data-bg="charcoal"] {
    --ink: #f4efe6; --ink-soft: #b3aa9c; --line: #332e27;
    --card: #211d18; --cream: #161310;
    color: var(--ink);
  }
  body[data-bg="charcoal"] .page-bg {
    background:
      radial-gradient(1000px 600px at 85% -6%, rgba(78,155,53,.18), transparent 55%),
      radial-gradient(900px 560px at 6% 8%, rgba(214,52,44,.16), transparent 55%),
      radial-gradient(1400px 1000px at 50% 120%, rgba(0,0,0,.5), transparent 60%),
      #161310;
  }
  body[data-bg="terrazzo"] .page-bg {
    background-color: #f8f3ea;
    background-image:
      radial-gradient(circle at 12% 22%, var(--green) 0 4px, transparent 5px),
      radial-gradient(circle at 78% 14%, var(--red) 0 3px, transparent 4px),
      radial-gradient(circle at 64% 62%, #e0a23b 0 3px, transparent 4px),
      radial-gradient(circle at 30% 78%, var(--red) 0 3px, transparent 4px),
      radial-gradient(circle at 90% 84%, var(--green) 0 4px, transparent 5px),
      radial-gradient(circle at 46% 36%, #e0a23b 0 2.5px, transparent 3.5px);
    background-size: 240px 240px;
    opacity: 1;
  }
  body[data-bg="terrazzo"] .page-bg::after {
    content:""; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(248,243,234,.86), rgba(243,237,225,.92));
  }

  .wrap { width: min(1180px, 92vw); margin: 0 auto; }

  /* ---------- App mount ---------- */
  #root { min-height: 100vh; }
  ::selection { background: color-mix(in oklab, var(--primary) 24%, white); }

  /* scrollbar for nav rail */
  .no-bar::-webkit-scrollbar { height: 0; width: 0; }
  .no-bar { scrollbar-width: none; }

  /* responsive helpers */
  @media (max-width: 860px) { .hide-md { display: none !important; } }
  @media (max-width: 560px) { .hide-sm { display: none !important; } }
  @media (max-width: 860px) {
    .hero-grid { grid-template-columns: 1fr !important; }
  }
</style>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

/* ============================ sticky category nav ============================ */
function CategoryNav({ cats, active, onPick, navRef, topOffset, navStyle }) {
  const railRef = useRef(null);
  useEffect(() => {
    const rail = railRef.current; if (!rail) return;
    const el = rail.querySelector(`[data-nav="${active}"]`);
    if (el) {
      const target = el.offsetLeft - rail.clientWidth / 2 + el.clientWidth / 2;
      rail.scrollTo({ left: target, behavior: "smooth" });
    }
  }, [active]);

  const underline = navStyle === "Underline";
  return (
    <nav ref={navRef} style={{
      position: "sticky", top: topOffset, zIndex: 40,
      background: "color-mix(in oklab, var(--cream) 88%, transparent)",
      backdropFilter: "blur(12px)", WebkitBackdropFilter: "blur(12px)",
      borderBottom: "1px solid var(--line)",
    }}>
      <div className="wrap" style={{ display: "flex", alignItems: "center", gap: 14 }}>
        <span className="hide-sm" style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 17, paddingRight: 4, flexShrink: 0 }}>Menu</span>
        <div ref={railRef} className="no-bar" style={{ display: "flex", gap: underline ? 6 : 9, overflowX: "auto", padding: "12px 2px", scrollPadding: "0 40px" }}>
          {cats.map((c) => {
            const on = active === c.id;
            if (underline) {
              return (
                <button key={c.id} data-nav={c.id} onClick={() => onPick(c.id)} style={{
                  border: "none", background: "transparent", cursor: "pointer", whiteSpace: "nowrap",
                  fontFamily: "var(--font-body)", fontWeight: 700, fontSize: 14.5,
                  color: on ? "var(--ink)" : "var(--ink-soft)", padding: "8px 12px 12px",
                  borderBottom: `3px solid ${on ? "var(--primary)" : "transparent"}`,
                  marginBottom: -1, transition: "color .15s",
                }}>{c.name}</button>
              );
            }
            return (
              <button key={c.id} data-nav={c.id} onClick={() => onPick(c.id)} style={{
                border: `1.5px solid ${on ? "transparent" : "var(--line)"}`, cursor: "pointer", whiteSpace: "nowrap",
                fontFamily: "var(--font-body)", fontWeight: 700, fontSize: 14, borderRadius: 999, padding: "9px 17px",
                color: on ? "#fff" : "var(--ink)",
                background: on ? "linear-gradient(180deg, var(--primary), var(--primary-deep))" : "var(--card)",
                boxShadow: on ? "0 5px 14px color-mix(in oklab, var(--primary) 32%, transparent)" : "var(--shadow-sm)",
                transition: "all .16s",
              }}>{c.name}</button>
            );
          })}
        </div>
      </div>
    </nav>
  );
}

      border: "none", cursor: "pointer", borderRadius: 16, padding: "14px 20px",

      transform: bump ? "scale(1.06)" : "scale(1)", transition: "transform .18s",
    }}>
      <span style={{ display: "inline-flex", alignItems: "center", gap: 9, fontWeight: 800, fontSize: 15 }}>
        <span style={{ position: "relative", display: "grid", placeItems: "center" }}>

        View cart
      </span>

      <span style={{ fontWeight: 800, fontSize: 15 }}>{money(total)}</span>

}

function CartDrawer({ open, onClose, lines, onAdd, onSub, onRemove, mode }) {
  const [placed, setPlaced] = useState(false);
  useEffect(() => { if (!open) setPlaced(false); }, [open]);
  const subtotal = lines.reduce((s, l) => s + l.item.price * l.qty, 0);
  const fee = mode === "Delivery" ? 2.99 : 0;
  const discount = subtotal * 0.05;
  const tax = (subtotal - discount + fee) * 0.06;
  const total = subtotal - discount + fee + tax;

  return (
    <>
      <div onClick={onClose} style={{
        position: "fixed", inset: 0, zIndex: 70, background: "rgba(20,16,12,.45)",
        backdropFilter: "blur(2px)", opacity: open ? 1 : 0, pointerEvents: open ? "auto" : "none", transition: "opacity .28s",
      }}></div>
      <aside style={{
        position: "fixed", top: 0, right: 0, bottom: 0, zIndex: 71, width: "min(420px, 92vw)",
        background: "var(--card)", boxShadow: "var(--shadow-lg)", display: "flex", flexDirection: "column",
        transform: open ? "translateX(0)" : "translateX(102%)", transition: "transform .3s cubic-bezier(.4,0,.1,1)",
      }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "20px 22px", borderBottom: "1px solid var(--line)" }}>
          <div>
            <h2 style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 21, margin: 0 }}>Your order</h2>
            <span style={{ fontSize: 13, color: "var(--ink-soft)", fontWeight: 600 }}>{mode} · {mode === "Delivery" ? INFO.delivery : INFO.pickup}</span>
          </div>
          <button onClick={onClose} aria-label="Close cart" style={{ border: "1px solid var(--line)", background: "var(--card)", borderRadius: 10, width: 38, height: 38, cursor: "pointer", display: "grid", placeItems: "center", color: "var(--ink)" }}><Icon name="close" size={18} /></button>
        </div>

        {placed ? (
          <div style={{ flex: 1, display: "grid", placeItems: "center", padding: 30, textAlign: "center" }}>
            <div>
              <div style={{ width: 72, height: 72, borderRadius: "50%", background: "color-mix(in oklab, var(--green) 18%, transparent)", color: "var(--green-deep)", display: "grid", placeItems: "center", margin: "0 auto 18px" }}>
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M5 13l4 4L19 7" /></svg>
              </div>
              <h3 style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 22, margin: "0 0 6px" }}>Order placed!</h3>
              <p style={{ color: "var(--ink-soft)", fontSize: 14.5, margin: 0 }}>The Sokolata kitchen is firing it up.<br />{mode === "Delivery" ? "Arriving in " + INFO.delivery : "Ready in " + INFO.pickup}.</p>
              <button onClick={onClose} style={{ marginTop: 22, border: "none", cursor: "pointer", borderRadius: 12, padding: "12px 22px", fontWeight: 800, color: "#fff", background: "linear-gradient(180deg, var(--green), var(--green-deep))" }}>Done</button>
            </div>
          </div>
        ) : lines.length === 0 ? (
          <div style={{ flex: 1, display: "grid", placeItems: "center", padding: 30, textAlign: "center", color: "var(--ink-soft)" }}>
            <div>
              <div style={{ opacity: .35, marginBottom: 12 }}><Icon name="bag" size={48} /></div>
              <p style={{ margin: 0, fontWeight: 600 }}>Your cart is empty.<br />Add something delicious.</p>
            </div>
          </div>
        ) : (
          <>
            <div style={{ flex: 1, overflowY: "auto", padding: "14px 18px" }}>
              {lines.map((l) => (
                <div key={l.key} style={{ display: "grid", gridTemplateColumns: "54px 1fr auto", gap: 12, alignItems: "center", padding: "12px 0", borderBottom: "1px solid var(--line)" }}>
                  <div style={{ width: 54, height: 54 }}><FoodThumb catId={l.catId} label={l.item.name} /></div>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontWeight: 700, fontSize: 14.5, fontFamily: "var(--font-display)" }}>{l.item.name}</div>
                    <div style={{ fontSize: 13, color: "var(--ink-soft)", fontWeight: 600 }}>{money(l.item.price)}</div>
                    <div style={{ display: "inline-flex", alignItems: "center", gap: 4, marginTop: 6, background: "color-mix(in oklab, var(--ink) 6%, transparent)", borderRadius: 999, padding: 2 }}>
                      <button onClick={() => onSub(l.key)} style={qtyBtn(false)}><Icon name={l.qty === 1 ? "trash" : "minus"} size={15} /></button>
                      <span style={{ minWidth: 20, textAlign: "center", fontWeight: 800, fontSize: 13.5 }}>{l.qty}</span>
                      <button onClick={() => onAdd(l.key)} style={qtyBtn(true)}><Icon name="plus" size={15} /></button>
                    </div>
                  </div>
                  <div style={{ fontWeight: 800, fontFamily: "var(--font-display)", fontSize: 15 }}>{money(l.item.price * l.qty)}</div>
                </div>
              ))}
            </div>
            <div style={{ padding: "16px 20px 20px", borderTop: "1px solid var(--line)", background: "color-mix(in oklab, var(--cream) 50%, var(--card))" }}>
              {[["Subtotal", subtotal], ["Online discount (5%)", -discount], [mode === "Delivery" ? "Delivery fee" : "Pickup", fee], ["Tax", tax]].map(([k, v]) => (
                <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, padding: "4px 0", color: v < 0 ? "var(--green-deep)" : "var(--ink-soft)", fontWeight: 600 }}>
                  <span>{k}</span><span>{v < 0 ? "−" + money(-v) : (v === 0 ? "Free" : money(v))}</span>
                </div>
              ))}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10, paddingTop: 12, borderTop: "1px dashed var(--line)" }}>
                <span style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 18 }}>Total</span>
                <span style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 20 }}>{money(total)}</span>
              </div>
              <button onClick={() => setPlaced(true)} style={{
                width: "100%", marginTop: 14, border: "none", cursor: "pointer", borderRadius: 14, padding: "15px",
                fontFamily: "var(--font-body)", fontWeight: 800, fontSize: 16, color: "#fff",
                background: "linear-gradient(180deg, var(--primary), var(--primary-deep))",
                boxShadow: "0 10px 24px color-mix(in oklab, var(--primary) 38%, transparent)",
              }}>Checkout · {money(total)}</button>
            </div>
          </>
        )}
      </aside>
    </>
  );
}

/* ============================ app ============================ */
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [mode, setMode] = useState("Delivery");
  const [cart, setCart] = useState({});
  const [active, setActive] = useState(MENU[0].id);
  const [cartOpen, setCartOpen] = useState(false);
  const [bump, setBump] = useState(false);

  const headerRef = useRef(null);
  const navRef = useRef(null);
  const sectionRefs = useRef({});
  const [topOffset, setTopOffset] = useState(70);

  /* apply visual tweaks */
  useEffect(() => { document.body.setAttribute("data-bg", t.background); }, [t.background]);
  useEffect(() => {
    const root = document.documentElement.style;
    if (t.accent === "Green") { root.setProperty("--primary", "var(--green)"); root.setProperty("--primary-deep", "var(--green-deep)"); }
    else { root.setProperty("--primary", "var(--red)"); root.setProperty("--primary-deep", "var(--red-deep)"); }
  }, [t.accent]);
  useEffect(() => { document.documentElement.style.setProperty("--font-display", FONT_STACK[t.displayFont]); }, [t.displayFont]);

  /* measure sticky offset (header height) */
  useEffect(() => {
    const measure = () => setTopOffset(headerRef.current ? headerRef.current.offsetHeight : 70);
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, []);

  /* active-section tracking */
  useEffect(() => {
    const navH = navRef.current ? navRef.current.offsetHeight : 64;
    const obs = new IntersectionObserver((entries) => {
      const vis = entries.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (vis[0]) setActive(vis[0].target.id);
    }, { rootMargin: `-${topOffset + navH + 8}px 0px -62% 0px`, threshold: 0 });
    MENU.forEach((c) => { const el = sectionRefs.current[c.id]; if (el) obs.observe(el); });
    return () => obs.disconnect();
  }, [topOffset]);

  const scrollToCat = useCallback((id) => {
    const el = sectionRefs.current[id]; if (!el) return;
    const navH = navRef.current ? navRef.current.offsetHeight : 64;
    const y = el.getBoundingClientRect().top + window.scrollY - (topOffset + navH + 12);
    setActive(id);
    window.scrollTo({ top: y, behavior: "smooth" });
  }, [topOffset]);

  /* cart ops */
  const pulse = () => { setBump(true); setTimeout(() => setBump(false), 200); };
  const addItem = (item, catId) => {
    const key = catId + "::" + item.name;
    setCart((c) => ({ ...c, [key]: { item, catId, qty: (c[key]?.qty || 0) + 1 } }));
    pulse();
  };
  const subItem = (key) => setCart((c) => {
    const cur = c[key]; if (!cur) return c;
    const n = { ...c };
    if (cur.qty <= 1) delete n[key]; else n[key] = { ...cur, qty: cur.qty - 1 };
    return n;
  });
  const addByKey = (key) => setCart((c) => ({ ...c, [key]: { ...c[key], qty: c[key].qty + 1 } }));

  const lines = Object.entries(cart).map(([key, v]) => ({ key, ...v }));
  const count = lines.reduce((s, l) => s + l.qty, 0);
  const cartTotal = lines.reduce((s, l) => s + l.item.price * l.qty, 0);
  const qtyOf = (catId, name) => cart[catId + "::" + name]?.qty || 0;

  const favToItem = (f) => {
    const cat = MENU.find((m) => m.name === f.cat);
    const real = cat?.items.find((i) => i.name === f.name) || { name: f.name, price: f.price, desc: f.desc };
    addItem(real, cat ? cat.id : "fav");
  };

  return (
    <div>
      <PromoBar />
      <Header mode={mode} setMode={setMode} headerRef={headerRef} onOrder={() => scrollToCat(MENU[0].id)} />
      <Hero onStart={() => scrollToCat(MENU[0].id)} />
      {t.showFavorites && <Favorites onAddFav={favToItem} />}
      <CategoryNav cats={MENU} active={active} onPick={scrollToCat} navRef={navRef} topOffset={topOffset} navStyle={t.navStyle} />

      <main className="wrap" style={{ paddingTop: 8, paddingBottom: 90 }}>
        {MENU.map((cat) => (
          <section key={cat.id} id={cat.id} ref={(el) => (sectionRefs.current[cat.id] = el)} style={{ scrollMarginTop: topOffset + 80, paddingTop: 34 }}>
            <div className="sec-head" style={{ marginBottom: 18 }}>
              <h2 style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 28, margin: 0, letterSpacing: "-.02em" }}>{cat.name}</h2>
              <p style={{ margin: "6px 0 0", color: "var(--ink-soft)", fontSize: 15, maxWidth: "60ch", textWrap: "pretty" }}>{cat.blurb}</p>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(330px, 1fr))", gap: 16 }}>
              {cat.items.map((item) => (
                <ItemCard key={item.name} item={item} catId={cat.id} qty={qtyOf(cat.id, item.name)}
                  onAdd={() => addItem(item, cat.id)} onSub={() => subItem(cat.id + "::" + item.name)} />
              ))}
            </div>
          </section>
        ))}

        <footer className="site-footer" style={{ marginTop: 64, paddingTop: 28, borderTop: "1px solid var(--line)", display: "flex", flexWrap: "wrap", gap: 18, alignItems: "center", justifyContent: "space-between", color: "var(--ink-soft)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <BrandMark size={30} />
            <div>
              <div style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 17, color: "var(--ink)" }}>Sokolata</div>
              <div style={{ fontSize: 13 }}>{INFO.address}</div>
            </div>
          </div>
          <div style={{ fontSize: 13, textAlign: "right" }}>
            <div style={{ display: "inline-flex", alignItems: "center", gap: 7 }}><Icon name="clock" size={15} /> {INFO.hours}</div>
            <div style={{ marginTop: 4 }}>{INFO.phone}</div>
          </div>
        </footer>
      </main>

      <CartButton count={count} total={cartTotal} bump={bump} onClick={() => setCartOpen(true)} />
      <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} lines={lines} mode={mode}
        onAdd={addByKey} onSub={subItem} />

      <TweaksPanel>
        <TweakSection label="Background" />
        <TweakSelect label="Page background" value={t.background}
          options={["cream", "pattern", "charcoal", "terrazzo", "brick"]}
          onChange={(v) => setTweak("background", v)} />
        <TweakSection label="Brand" />
        <TweakRadio label="Accent" value={t.accent} options={["Red", "Green"]} onChange={(v) => setTweak("accent", v)} />
        <TweakRadio label="Display font" value={t.displayFont} options={["Bricolage Grotesque", "Plus Jakarta Sans"]} onChange={(v) => setTweak("displayFont", v)} />
        <TweakSection label="Menu nav" />
        <TweakRadio label="Nav style" value={t.navStyle} options={["Pills", "Underline"]} onChange={(v) => setTweak("navStyle", v)} />
        <TweakToggle label="Show House Favorites" value={t.showFavorites} onChange={(v) => setTweak("showFavorites", v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
